name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - run: bun install --frozen-lockfile
      - name: Type check
        run: bun run typecheck
      - name: Task integrity
        run: bun src/cli.ts validate
      - name: Tests (offline — no model calls)
        run: bun test
